<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-ps.png" />
    <meta name="theme-color" content="#17171a" />
    <!-- viewport-fit=cover lets the page use the whole screen on a phone with a notch or a
         home indicator; the CSS then keeps content clear of them with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A web trading card game where real cars drag race a quarter mile."
    />
    <!-- The fonts are the site's own, loaded by src/fonts.css and fetched by `npm run fonts`
         (backlog P6), so the first load asks nothing of anyone else. -->
    <!-- How a shared room link looks wherever it is pasted. Making a room and sending the link
         to a friend is how an online match starts, so the link has to say what it is. The image
         is 1438x755, the 1.91:1 shape every reader crops to, and under 300 KB, over which some
         messengers quietly drop the preview. Absolute URLs: a reader does not resolve
         a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pink Slips" />
    <meta property="og:title" content="Pink Slips" />
    <meta
      property="og:description"
      content="Real cars drag race a quarter mile. Win the race, take the car. First to three pink slips wins."
    />
    <meta property="og:url" content="https://sgreen-dev.github.io/pink-slips/" />
    <meta property="og:image" content="https://sgreen-dev.github.io/pink-slips/social.jpg" />
    <meta property="og:image:width" content="1438" />
    <meta property="og:image:height" content="755" />
    <meta property="og:image:alt" content="Pink Slips: real cars drag race a quarter mile." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pink Slips" />
    <meta
      name="twitter:description"
      content="Real cars drag race a quarter mile. Win the race, take the car."
    />
    <meta name="twitter:image" content="https://sgreen-dev.github.io/pink-slips/social.jpg" />
    <title>Pink Slips</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

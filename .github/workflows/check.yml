# Every check the deploy runs, but on a pull request and on any branch, so nothing lands on
# main unverified. Kept separate from deploy.yml because that workflow holds pages: write and
# id-token: write, which a pull request has no business carrying.
name: Check

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
